<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Formulaires</title><meta name="robots" content="noindex"></head>
<body>
<!-- Déclaration du formulaire pour Netlify Forms (le site est exporté en statique) -->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact">
  <input name="bot-field"><input name="nom"><input name="email" type="email"><input name="entreprise"><textarea name="message"></textarea>
</form>
</body></html>
